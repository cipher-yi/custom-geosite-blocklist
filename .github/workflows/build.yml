name: Build and Release GeoSite Blocklist

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
  schedule:
    # Runs everyday at 19:00 UTC (03:00 Beijing Time)
    - cron: "0 19 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build:
    name: Compile and Release GeoSite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.21.0"
          cache: false

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch and Process Domain Lists
        run: |
          python scripts/build.py

      - name: Compile GeoSite Binary via v2fly Compiler
        run: |
          mkdir -p dist
          git clone --depth=1 https://github.com/v2fly/domain-list-community.git compiler
          cd compiler
          go run main.go --datapath=../data --outputdir=../dist --outputname=geosite.dat
          cd ../dist
          sha256sum geosite.dat > geosite.dat.sha256sum
          ls -lh geosite.dat

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release
          name: "Latest GeoSite Blocklist Release"
          body: |
            Automated Daily Build (${{ github.sha }})
            
            ### Included GeoSite Categories:
            - `geosite:carrier-gateway` - China carrier silent MSISDN query & one-click passwordless login gateways
            - `geosite:antifraud` - China-specific anti-fraud, cloud scanning & security inspection
            - `geosite:malware` - Threat intelligence, malicious URLs, phishing & botnets
            - `geosite:pcdn` - Anti-PCDN bandwidth leeching protection
            - `geosite:httpdns` - HTTPDNS endpoint blocking to enforce local DNS
            - `geosite:privacy` - Global & domestic telemetry, crash logging & analytics
            - `geosite:ads` - Commercial advertising and splash screen filtering
            - `geosite:doh-bypass` - Public Encrypted DNS endpoints blocking
            
            ### Direct Download Links:
            - **GitHub Release:** `https://github.com/${{ github.repository }}/releases/latest/download/geosite.dat`
            - **jsDelivr CDN:** `https://cdn.jsdelivr.net/gh/${{ github.repository }}@release/geosite.dat`
          files: |
            dist/geosite.dat
            dist/geosite.dat.sha256sum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Release Branch for jsDelivr CDN
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: release
          publish_dir: ./dist
          keep_files: false
          force_orphan: true
